name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Static analysis runs ONCE, on one interpreter, with pinned tools.
  # Running it across the test matrix meant pip resolved a different mypy per
  # Python version (1.14 on 3.8, 1.19 on 3.9, 2.3 on 3.10+), and those versions
  # disagree — disallow_any_decorated flags @staticmethod signatures containing
  # Any on 1.x but not on 2.x. A gate whose verdict depends on which interpreter
  # happened to run it is not a gate. The language level checked is governed by
  # python_version in pyproject.toml, not by the interpreter running mypy.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Format check with black
      run: black --check .
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Import order with isort
      run: isort --check-only --diff .
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Type check with mypy
      run: mypy .
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Lint with ruff
      run: ruff check .
      env:
        PYTHONPATH: ${{ github.workspace }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project in editable mode with dev dependencies
        pip install -e ".[dev]"
        
    - name: Test with pytest
      run: |
        pytest -v
      env:
        PYTHONPATH: ${{ github.workspace }}
        CHECKMK_SERVER_URL: http://localhost:8080
        CHECKMK_SITE: test
        CHECKMK_USERNAME: automation
        CHECKMK_PASSWORD: test-password