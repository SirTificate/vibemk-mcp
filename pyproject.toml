[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibemk-mcp"
version = "0.4.0"
description = "vibeMK - CheckMK monitoring via LLM - MCP Server"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Andre", email = "chexma@gmx.de"}
]
maintainers = [
    {name = "Steffen Konerow"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["checkmk", "monitoring", "mcp", "claude", "automation"]
dependencies = []
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/SirTificate/vibemk-mcp"
Documentation = "https://github.com/SirTificate/vibemk-mcp/blob/main/README.md"
Repository = "https://github.com/SirTificate/vibemk-mcp"
"Upstream (inactive)" = "https://github.com/chexma/vibeMK"
Issues = "https://github.com/SirTificate/vibemk-mcp/issues"

[project.scripts]
vibemk = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0"
]

[tool.black]
line-length = 120
target-version = ['py38']

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "T10", "EXE", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

# Same rule as the mypy list above: this may only shrink.
[tool.ruff.lint.per-file-ignores]
"api/__init__.py" = ["RUF022"]
"api/exceptions.py" = ["ANN204", "PIE790"]
"checkmk_types/__init__.py" = ["F403", "F405", "RUF022"]
"checkmk_types/checkmk_types.py" = ["F401"]
"handlers/__init__.py" = ["RUF022"]
"handlers/base.py" = ["PIE790", "PYI041", "RUF001"]
"handlers/configuration.py" = ["G004", "PLR2004", "RET505", "RUF001"]
"handlers/discovery.py" = ["E501", "G004", "ISC004", "PLR2004", "RET505", "RUF010"]
# PLR0911/PLR0912 only: handle() is a tool-name dispatch table (same shape kept
# across every handler module); _parse_natural_time's five parsing patterns are
# independent early-returning alternatives over already-tested (17 regression
# tests), timezone-sensitive code, so it is deliberately not restructured here.
# Restructuring either is separate work from this pass.
"handlers/downtimes.py" = ["PLR0911", "PLR0912"]
"handlers/folders.py" = ["G004", "PLR0911", "RET505"]
"handlers/groups.py" = ["ARG002", "G004", "PLR0911", "RET505"]
"handlers/host_group_rules.py" = ["ARG002", "E501", "F541", "G004", "PLR0911", "PLR0912", "PLR0915", "RET505", "RUF010"]
# PLR0911/PLR0912 only: handle() is a tool-name dispatch table (same shape kept
# across every handler module) with more tool branches than most; restructuring
# it is separate work from this pass.
"handlers/hosts.py" = ["PLR0911", "PLR0912"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module); _get_service_metrics has a two-step fallback chain (list available
# metrics, then fetch the named one) whose branches are independent by design.
# Restructuring either is separate work from this pass.
"handlers/metrics.py" = ["PLR0911"]
"handlers/monitoring.py" = ["G004", "ISC001", "PLR0911", "RET505", "RUF001", "TRY400"]
"handlers/notifications.py" = ["G004", "PLC0415", "PLR0911", "RET505"]
"handlers/passwords.py" = ["ARG002", "G004", "PLR0911", "RET505"]
"handlers/rules.py" = ["ARG002", "F541", "F841", "G004", "PLR0911", "PLR2004", "RET505"]
"handlers/service_groups.py" = ["ARG002", "F401", "F541", "F841", "PLC0415", "PLR0911", "RET505", "RUF001", "RUF010"]
"handlers/tags.py" = ["ARG002", "G004", "PLR0911", "PLR2004", "RET505"]
"handlers/users.py" = ["ARG002", "F541", "G004", "PLR0911", "PLR0912", "RET505", "RUF001", "RUF005"]
"mcp/tools.py" = ["E501", "RUF001"]
"tests/conftest.py" = ["ANN001", "ANN201", "F401"]
"tests/test_api_client.py" = ["ANN001", "ANN201", "F401", "PLR2004"]
"tests/test_checkmk_endpoints.py" = ["ANN001", "ANN201"]
"tests/test_client_transport.py" = ["ANN001", "ANN003", "ANN201", "PLC0415"]
"tests/test_config.py" = ["ANN201", "PLR2004", "SIM117"]
"tests/test_dotenv.py" = ["ANN001", "ANN201"]
"tests/test_etag_locking.py" = ["ANN001", "ANN201", "SLF001"]
"tests/test_handlers_downtimes.py" = ["ANN001", "ANN201", "ARG002", "DTZ007", "F401", "PLR2004", "SLF001"]
"tests/test_handlers_hosts.py" = ["ANN001", "ANN201", "F401", "F841"]
"tests/test_handlers_metrics.py" = ["ANN001", "ANN201", "ARG001", "PT006", "SLF001"]
"tests/test_handlers_notifications.py" = ["ANN001", "ANN201"]
"tests/test_handlers_services.py" = ["ANN001", "ANN201"]
"tests/test_integration.py" = ["ANN001", "ANN201", "B007", "F401", "PLC0415", "PLR2004"]
"tests/test_mcp_server.py" = ["ANN001", "ANN201", "ANN202", "ANN204", "PLR2004", "TRY003"]
"tests/test_tool_registry.py" = ["ANN001", "ANN201", "PLC0415"]
"tests/test_transport.py" = ["ANN001", "ANN201", "ANN202", "ARG001", "F401", "PLC0415"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
# Enhanced strict mode settings
disallow_any_unimported = true
disallow_any_expr = false  # Allow Any in expressions for gradual typing
disallow_any_decorated = true
disallow_any_explicit = false  # Allow explicit Any usage
disallow_any_generics = true
disallow_subclassing_any = true
warn_unreachable = true
warn_no_return = true
warn_redundant_casts = true
show_error_codes = true
# Ignore missing imports for external libraries
ignore_missing_imports = true
# Specific module configurations
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # Allow untyped tests during migration

# Modules not yet type-clean. This list may only shrink: tests/test_lint_ratchet.py
# fails when an entry is no longer needed. Do not add to it — a module you
# change must be brought up to the configured strictness.
[[tool.mypy.overrides]]
module = [
    "tests.conftest",
    "tests.test_api_client",
    "tests.test_checkmk_endpoints",
    "tests.test_client_transport",
    "tests.test_dotenv",
    "tests.test_etag_locking",
    "tests.test_handlers_hosts",
    "tests.test_handlers_metrics",
    "tests.test_handlers_notifications",
    "tests.test_handlers_services",
    "tests.test_integration",
    "tests.test_mcp_server",
    "tests.test_transport",
]
ignore_errors = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["api", "checkmk_types", "config", "handlers", "mcp", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
