[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibemk-mcp"
version = "0.4.0"
description = "vibeMK - CheckMK monitoring via LLM - MCP Server"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Andre", email = "chexma@gmx.de"}
]
maintainers = [
    {name = "Steffen Konerow"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["checkmk", "monitoring", "mcp", "claude", "automation"]
dependencies = []
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/SirTificate/vibemk-mcp"
Documentation = "https://github.com/SirTificate/vibemk-mcp/blob/main/README.md"
Repository = "https://github.com/SirTificate/vibemk-mcp"
"Upstream (inactive)" = "https://github.com/chexma/vibeMK"
Issues = "https://github.com/SirTificate/vibemk-mcp/issues"

[project.scripts]
vibemk = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0"
]

[tool.black]
line-length = 120
target-version = ['py38']

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "T10", "EXE", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]
# Response text throughout the codebase uses emoji as message-type icons
# (success/error/info/add, etc.). ℹ and ➕ are the two that RUF001 flags as
# visually confusable with ASCII; both are intentional icons, not typos, so
# they are allowlisted globally rather than suppressed per file.
allowed-confusables = ["ℹ", "➕"]

# Same rule as the mypy list above: this may only shrink.
[tool.ruff.lint.per-file-ignores]
"api/__init__.py" = ["RUF022"]
"api/exceptions.py" = ["ANN204", "PIE790"]
"checkmk_types/__init__.py" = ["F403", "F405", "RUF022"]
"checkmk_types/checkmk_types.py" = ["F401"]
# TRY300 only: each flagged method's try wraps both the API call and the response
# processing that follows it (checking result["success"], reading nested fields),
# by design, so that a malformed response falls through to the same except Exception
# handler as a transport error instead of crashing. TRY300 wants the final return
# moved into a try/else, which would take that processing out from under the
# except and is exactly the narrowing this project's hardening passes avoid.
"handlers/discovery.py" = ["TRY300"]
# PLR0911/PLR0912 only: handle() is a tool-name dispatch table (same shape kept
# across every handler module); _parse_natural_time's five parsing patterns are
# independent early-returning alternatives over already-tested (17 regression
# tests), timezone-sensitive code, so it is deliberately not restructured here.
# Restructuring either is separate work from this pass.
"handlers/downtimes.py" = ["PLR0911", "PLR0912"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/folders.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/groups.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/host_group_rules.py" = ["PLR0911"]
# PLR0911/PLR0912 only: handle() is a tool-name dispatch table (same shape kept
# across every handler module) with more tool branches than most; restructuring
# it is separate work from this pass.
"handlers/hosts.py" = ["PLR0911", "PLR0912"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module); _get_service_metrics has a two-step fallback chain (list available
# metrics, then fetch the named one) whose branches are independent by design.
# Restructuring either is separate work from this pass.
"handlers/metrics.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/monitoring.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/notifications.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/passwords.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/rules.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/service_groups.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/tags.py" = ["PLR0911"]
# PLR0911 only: handle() is a tool-name dispatch table (same shape kept across every
# handler module). Restructuring it is separate work from this pass.
"handlers/users.py" = ["PLR0911"]
"mcp/tools.py" = ["E501"]
# ANN001/ANN201/ANN202/ANN204 only, across every tests/ entry below: mirrors the
# tests.* mypy override above — a test function or fixture taking a mock and
# returning None (or nothing) gains nothing from being told so on every one.
# Each file's remaining code(s), where present, are a specific deferral:
#   PLR2004 (test_api_client, test_config, test_handlers_downtimes,
#     test_integration, test_mcp_server): the numeric literals compared are
#     already documented by context immediately above the assertion (the
#     env/config dict just set, or a well-known HTTP/JSON-RPC status code) --
#     naming a constant would not make the expectation any clearer.
#   SLF001 (test_etag_locking, test_handlers_downtimes, test_handlers_metrics):
#     these files test a handler's private time/ETag-parsing helpers directly;
#     that access is the test's whole point, not an accident.
#   TRY003 (test_mcp_server): a two-line local test double that simulates a
#     configuration failure, not application code that warrants its own
#     exception subclass.
"tests/conftest.py" = ["ANN001", "ANN201"]
"tests/test_api_client.py" = ["ANN001", "ANN201", "PLR2004"]
"tests/test_checkmk_endpoints.py" = ["ANN001", "ANN201"]
"tests/test_client_transport.py" = ["ANN001", "ANN201"]
"tests/test_config.py" = ["ANN201", "PLR2004"]
"tests/test_dotenv.py" = ["ANN001", "ANN201"]
"tests/test_etag_locking.py" = ["ANN001", "ANN201", "SLF001"]
"tests/test_handlers_downtimes.py" = ["ANN001", "ANN201", "PLR2004", "SLF001"]
"tests/test_handlers_hosts.py" = ["ANN001", "ANN201"]
"tests/test_handlers_metrics.py" = ["ANN001", "ANN201", "SLF001"]
"tests/test_handlers_notifications.py" = ["ANN001", "ANN201"]
"tests/test_integration.py" = ["ANN001", "ANN201", "PLR2004"]
"tests/test_mcp_server.py" = ["ANN001", "ANN201", "ANN202", "ANN204", "PLR2004", "TRY003"]
"tests/test_tool_registry.py" = ["ANN001", "ANN201"]
"tests/test_transport.py" = ["ANN001", "ANN201", "ANN202"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
# Enhanced strict mode settings
disallow_any_unimported = true
disallow_any_expr = false  # Allow Any in expressions for gradual typing
disallow_any_decorated = true
disallow_any_explicit = false  # Allow explicit Any usage
disallow_any_generics = true
disallow_subclassing_any = true
warn_unreachable = true
warn_no_return = true
warn_redundant_casts = true
show_error_codes = true
# Ignore missing imports for external libraries
ignore_missing_imports = true
# Specific module configurations
#
# Tests are exempt from mandatory annotations, not from type checking. A test
# function or fixture returning None gains nothing from `-> None` on every
# one, so disallow_untyped_defs stays off here — but that is a narrow
# exemption, not a blanket one: the three flags below only turn off the
# consequences of *that* choice (an unannotated function is "untyped", so
# strict mode would otherwise flag every call into it and every
# @pytest.fixture/@patch decorating it). Wrong argument types, bad attribute
# access, unsafe indexing and everything else strict mode checks still apply
# to tests.* — there is no ignore_errors for this module pattern.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # a test returning None gains nothing from saying so
disallow_untyped_calls = false  # ...so calling an unannotated test/fixture must stay legal
disallow_untyped_decorators = false  # ...and so must decorating one (@pytest.fixture, @patch)
disallow_any_decorated = false  # unittest.mock.patch's decorator return type is Callable[..., Any]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["api", "checkmk_types", "config", "handlers", "mcp", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
